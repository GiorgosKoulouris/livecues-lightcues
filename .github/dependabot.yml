# Dependabot version updates: weekly, PRs against `dev`. Merging them, the
# security PRs on `main`, and the `global-agent` override (no ignore rule
# needed): docs/development.md § CI. Promote: docs/agents/promote.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      runtime:
        dependency-type: production
    ignore:
      # typescript-eslint 8.x peers typescript <6.1.0, so a TS 7 bump breaks
      # `npm ci`. Remove once typescript-eslint accepts TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
