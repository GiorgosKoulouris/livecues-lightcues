# Test coverage (npm run coverage). Report only: it never fails on a number.
# - The run's summary page gets a table. The HTML report is an artifact.
# - Push to `main`: also publishes the README badge, a one-file endpoint
#   (coverage.json) on the orphan `badges` branch that shields.io reads.
#   The branch is rewritten each run, so it holds one commit.
# See docs/development.md § CI.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Write access is for the `badges` branch, and only a push to `main` uses it.
permissions:
  contents: write

jobs:
  coverage:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run coverage

      - name: Summary and badge data
        run: |
          {
            echo "## Test coverage"
            echo
            node scripts/coverage-summary.mjs coverage/coverage-summary.json "$RUNNER_TEMP/coverage.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Publish badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/badges"
          rm -rf "$dir"
          git init -q -b badges "$dir"
          cp "$RUNNER_TEMP/coverage.json" "$dir/coverage.json"
          cd "$dir"
          git add coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
